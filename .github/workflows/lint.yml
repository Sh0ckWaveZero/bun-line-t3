name: Bun lint

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bun-lint-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    # Only use a separate runner restricted to trusted PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, ARM64, lint-isolated]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: 1.4.4
      # Keep this aligned with lefthook until stable includes bun lint.
      - name: Lint
        run: bunx --package bun@1.4.4-canary.20261031.1 bun lint
