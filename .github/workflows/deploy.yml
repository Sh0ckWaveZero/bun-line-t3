name: 🚀 Deploy to Production

on:
  push:
    branches: [main, production]
    paths-ignore:
      - "docs/**"
      - "logs/**"
      - "*.md"
      - ".vscode/**"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "สร้าง image ใหม่โดยไม่ใช้ cache"
        default: false
        type: boolean

permissions:
  contents: read

# ทุก branch ใช้บริการ production ชุดเดียวกัน ห้าม deploy ซ้อนกัน
concurrency:
  group: bun-line-t3-production
  cancel-in-progress: false

jobs:
  deploy:
    name: ตรวจสอบ สร้าง และ deploy
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PORT: ${{ secrets.PORT || '12914' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_URL: ${{ secrets.APP_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      LINE_CLIENT_ID: ${{ secrets.LINE_CLIENT_ID }}
      LINE_CLIENT_SECRET: ${{ secrets.LINE_CLIENT_SECRET }}
      LINE_LOGIN_CHANNEL_ID: ${{ secrets.LINE_LOGIN_CHANNEL_ID }}
      LINE_LOGIN_CHANNEL_SECRET: ${{ secrets.LINE_LOGIN_CHANNEL_SECRET }}
      LINE_CHANNEL_ACCESS: ${{ secrets.LINE_CHANNEL_ACCESS }}
      LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
      ADMIN_LINE_USER_IDS: ${{ secrets.ADMIN_LINE_USER_IDS }}
      AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
      CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MCP_AI_MODEL: ${{ secrets.MCP_AI_MODEL || 'gpt-5.6-luna' }}
      APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
      ALLOWED_DOMAINS: ${{ secrets.ALLOWED_DOMAINS }}

      DOCKER_BUILDKIT: "1"
      COMPOSE_PARALLEL_LIMIT: "1"
      COMPOSE_PROJECT_NAME: bun-line-t3
      TZ: Asia/Bangkok
      FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
      RELEASE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      RUN_MIGRATIONS: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: ตรวจ configuration และทรัพยากรเครื่อง
        run: bash scripts/devops/deploy.sh preflight
      - name: เก็บ image เดิมสำหรับ rollback
        id: backup
        run: bash scripts/devops/deploy.sh backup
      - name: สร้าง image ทีละ service
        run: bash scripts/devops/deploy.sh build
      - name: รัน database migration
        run: bash scripts/devops/deploy.sh migrate
      - name: เปลี่ยนบริการ ตรวจ health และ rollback เมื่อจำเป็น
        env:
          PREVIOUS_APP_IMAGE: ${{ steps.backup.outputs.previous_app }}
          PREVIOUS_CRON_IMAGE: ${{ steps.backup.outputs.previous_cron }}
        run: bash scripts/devops/deploy.sh release
      - name: สรุปผล
        if: success()
        run: |
          echo "Deploy สำเร็จ: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
