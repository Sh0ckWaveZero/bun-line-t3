# Docker Compose file - version field removed for compatibility (Compose V2+ doesn't require it)

# 🛡️ SECURITY-FIRST Docker Compose สำหรับ Bun + TanStack Start + Prisma
# ปรับปรุงตาม Docker Security Best Practices
#
# 🔐 ENVIRONMENT VARIABLES STRATEGY:
# ===================================
# 1. GitHub Actions จะ inject ค่า environment variables จาก repository secrets
# 2. Docker Compose ใช้ค่าเหล่านั้นโดยตรง (ไม่ต้องพึ่งไฟล์ .env.prod)
# 3. ครอบคลุม required secrets เช่น DATABASE_URL, APP_URL, AUTH_SECRET, JWT_SECRET,
#    INTERNAL_API_KEY, CRON_SECRET, LINE_* (6 secrets), AQICN_TOKEN,
#    CMC_API_KEY, OPENAI_API_KEY, APP_DOMAIN, ALLOWED_DOMAINS
# 4. Security: ไม่มีไฟล์ sensitive ใดๆ บน production server

services:
  migrate:
    platform: linux/arm64
    image: bun-line-t3-migrate:${RELEASE_TAG:-latest}
    profiles: [deploy]
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
      args:
        APP_URL: ${APP_URL}
        FRONTEND_URL: ${FRONTEND_URL}
        APP_DOMAIN: ${APP_DOMAIN}
        ALLOWED_DOMAINS: ${ALLOWED_DOMAINS}
      secrets:
        - database_url
        - auth_secret
        - openai_api_key
        - admin_line_user_ids
    environment:
      DATABASE_URL: ${DATABASE_URL:?ต้องตั้งค่า DATABASE_URL}
    networks:
      - yadom

  app:
    platform: linux/arm64
    image: bun-line-t3-app:${APP_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
        - APP_URL=${APP_URL}
        - FRONTEND_URL=${FRONTEND_URL}
        - APP_DOMAIN=${APP_DOMAIN}
        - ALLOWED_DOMAINS=${ALLOWED_DOMAINS}
      # 🔐 SECURITY: Secrets ส่งเข้า build ผ่าน BuildKit secret mounts
      # (ไม่ผ่าน build args — ค่าไม่ติดใน image layers หรือ docker history)
      # ค่ามาจาก environment variables ที่ GitHub Actions inject (ดู deploy.yml)
      secrets:
        - database_url
        - auth_secret
        - openai_api_key
        - admin_line_user_ids
      target: runner
      # ขนาด /dev/shm ระหว่าง build ไม่ใช่ memory limit ของ build
      shm_size: 512m
    container_name: bun-line-t3-app
    ports:
      - "${PORT:-12914}:${PORT:-12914}" # ใช้ PORT จาก environment หรือ default 12914

    # 🔐 SECURITY: ใช้เฉพาะ GitHub Secrets (ไม่ต้องพึ่งไฟล์ .env.prod)
    # GitHub Actions จะ inject environment variables ทั้งหมดจาก repository secrets

    # 🛡️ PRODUCTION: Environment variables จาก GitHub Secrets เท่านั้น
    # ค่าทั้งหมดมาจาก GitHub Actions environment injection (17 secrets + static configs)
    environment:
      # =============================================================================
      # Application Environment (Static + Dynamic)
      # =============================================================================
      - NODE_ENV=production
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}
      - APP_ENV=production
      - NEXT_PUBLIC_APP_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=${PORT:-12914}
      - APP_URL=${APP_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}

      # =============================================================================
      # Authentication & Security (GitHub Secrets)
      # =============================================================================
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=18144000000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - CRON_SECRET=${CRON_SECRET}

      # =============================================================================
      # LINE Integration (6 GitHub Secrets)
      # =============================================================================
      # LINE Login Provider
      - LINE_CLIENT_ID=${LINE_CLIENT_ID}
      - LINE_CLIENT_SECRET=${LINE_CLIENT_SECRET}
      - LINE_LOGIN_CHANNEL_ID=${LINE_LOGIN_CHANNEL_ID}
      - LINE_LOGIN_CHANNEL_SECRET=${LINE_LOGIN_CHANNEL_SECRET}

      # LINE Messaging API
      - LINE_CHANNEL_ACCESS=${LINE_CHANNEL_ACCESS}
      - LINE_MESSAGING_API=https://api.line.me/v2/bot/message
      - LINE_GET_CONTENT=https://api-data.line.me/v2/bot/message
      - LINE_CHANNEL_SECRET=${LINE_CHANNEL_SECRET}
      - ADMIN_LINE_USER_IDS=${ADMIN_LINE_USER_IDS:-}

      # =============================================================================
      # Database Configuration (GitHub Secrets)
      # =============================================================================
      - DATABASE_URL=${DATABASE_URL}

      # =============================================================================
      # External API Keys (6 GitHub Secrets)
      # =============================================================================
      - AQICN_TOKEN=${AQICN_TOKEN}
      - CMC_API_KEY=${CMC_API_KEY}
      - CMC_URL=https://pro-api.coinmarketcap.com
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MCP_AI_MODEL=${MCP_AI_MODEL:-gpt-5.6-luna}

      # =============================================================================
      # Domain Security Configuration (GitHub Secrets)
      # =============================================================================
      - APP_DOMAIN=${APP_DOMAIN}
      - ALLOWED_DOMAINS=${ALLOWED_DOMAINS}
    # 🔄 AUTO-RESTART: เริ่มต้นอัตโนมัติหลังเปิดเครื่อง และ restart เมื่อ crash
    restart: always

    # 🔧 RASPBERRY PI OPTIMIZATION: จำกัด memory usage runtime
    mem_limit: 1.5g
    mem_reservation: 512m
    cpus: 2.0 # จำกัด CPU cores ที่ใช้

    # 🛡️ SECURITY: Health check ที่ปลอดภัยสำหรับตรวจสอบสถานะแอปพลิเคชัน
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent --max-time 5 http://127.0.0.1:$$PORT/api/health >/dev/null",
        ]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s # เพิ่มเวลาสำหรับ Pi ที่ช้ากว่า

    # 🔐 SECURITY: Security และ resource limits
    security_opt:
      - no-new-privileges:true
    read_only: false # แอปมีการเขียนไฟล์ชั่วคราว/รูป chart ลง public/temp-charts
    tmpfs:
      - /tmp:rw,size=100m,mode=1777
      - /var/tmp:rw,size=50m,mode=1777

    # 📁 VOLUMES: Chart files persistence
    volumes:
      - temp_charts:/app/public/temp-charts

    # 🔐 SECURITY: Network isolation - ใช้ yadom network ที่มีอยู่แล้ว
    networks:
      - yadom

  cron:
    platform: linux/arm64
    image: bun-line-t3-cron:${CRON_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.cron
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: bun-line-t3-cron

    # 🔐 SECURITY: ใช้เฉพาะ GitHub Secrets (ไม่ต้องพึ่งไฟล์ .env.prod)
    # Cron service รับ environment variables จาก GitHub Actions

    # 🛡️ PRODUCTION: Environment variables จาก GitHub Secrets เท่านั้น (cron service)
    # ✅ MINIMALIST: Cron service ใช้แค่ CRON_SECRET เพื่อเรียก API endpoints
    environment:
      # =============================================================================
      # Minimal Environment สำหรับ Cron Service
      # =============================================================================
      - NODE_ENV=production
      - TZ=Asia/Bangkok
      - CRON_BASE_URL=http://app:${PORT:-12914}

      # =============================================================================
      # Security: เฉพาะ CRON_SECRET ที่จำเป็นสำหรับ API calls
      # =============================================================================
      - CRON_SECRET=${CRON_SECRET}
    # 🔄 AUTO-RESTART: เริ่มต้นอัตโนมัติหลังเปิดเครื่อง และ restart เมื่อ crash
    restart: always

    # 🔧 RASPBERRY PI OPTIMIZATION: จำกัด memory สำหรับ cron service
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0

    # 🛡️ SECURITY: รอให้ app service ผ่าน health check ก่อนเริ่ม cron
    depends_on:
      app:
        condition: service_healthy

    # ⏰ CRON HEALTH CHECK: ตรวจสอบว่า cron service ยังทำงานอยู่
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x crond >/dev/null || exit 1"]
      interval: 300s # ตรวจสอบทุก 5 นาที
      timeout: 10s
      retries: 3
      start_period: 60s

    # 🔐 SECURITY: Security สำหรับ cron service
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,size=50m,mode=1777

    # 🔐 SECURITY: Network isolation - ใช้ yadom network ที่มีอยู่แล้ว
    networks:
      - yadom

# 🔐 SECURITY: Network configuration สำหรับ Raspberry Pi deployment
networks:
  yadom:
    external: true # ใช้ network yadom ที่มีอยู่แล้วในระบบ

# 🔐 BUILD SECRETS: BuildKit secret mounts (build-time only — ไม่ mount ตอน runtime)
# แปลง environment variables → /run/secrets/<name> ระหว่าง docker compose build
# ต้องใช้ Docker Compose v2.19+
secrets:
  database_url:
    environment: DATABASE_URL
  auth_secret:
    environment: AUTH_SECRET
  openai_api_key:
    environment: OPENAI_API_KEY
  admin_line_user_ids:
    environment: ADMIN_LINE_USER_IDS

# 📁 VOLUMES: Named volumes สำหรับ data persistence
volumes:
  temp_charts:
    driver: local
