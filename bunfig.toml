# Bun configuration file for test runner
[test]
root = "."
preload = ["./tests/bun.test.config.ts"]
coverage = false

# Path aliases for the entire project (affects tests too)
[install]
# Registry configuration - removed conflicting scopes

[lint]
ignorePatterns = [".next/", ".tanstack/", "dist/", "node_modules/", "src/routeTree.gen.ts"]

[lint.rules]
"@typescript-eslint/ban-ts-comment" = ["error", { ts-expect-error = "allow-with-description", ts-ignore = true, ts-nocheck = true }]
"@typescript-eslint/no-explicit-any" = "off"
"no-unused-vars" = ["error", { args = "after-used", argsIgnorePattern = "^_", ignoreRestSiblings = true, varsIgnorePattern = "^(_|AttendanceRecord|EditAttendanceData|MonthlyAttendanceReport|User|.*Props)$" }]
"react/react-in-jsx-scope" = "off"
"no-empty" = "error"
"no-misleading-character-class" = "error"
"no-redeclare" = "error"
"no-unsafe-finally" = "error"
"no-useless-assignment" = "error"
"no-unused-expressions" = "error"
"prefer-const" = "error"
"require-yield" = "error"
"react/no-unescaped-entities" = "error"
"no-underscore-dangle" = "off"
"no-shadow" = "off"
"@typescript-eslint/no-useless-constructor" = "off"
"@typescript-eslint/no-extraneous-class" = "off"
"no-unneeded-ternary" = "off"
"@typescript-eslint/no-useless-empty-export" = "off"
"preserve-caught-error" = "off"
"react/purity" = "warn"
"react/set-state-in-effect" = "warn"
"react/exhaustive-effect-dependencies" = "warn"
"react/memo-dependencies" = "warn"
"react/no-unstable-nested-components" = "warn"
"react-hooks/exhaustive-deps" = "warn"
